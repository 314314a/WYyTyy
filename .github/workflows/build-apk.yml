name: Build WYyTy Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Prepare Web Assets and Capacitor Config
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html styles.css app.js www/
          for f in manifest.json sw.js apple-touch-icon.png icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          echo '{"name":"wyyty","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"6.1.2","@capacitor/cli":"6.1.2","@capacitor/core":"6.1.2"}}' > package.json
          echo '{"appId":"com.wyyty.app","appName":"WYyTy","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          ls -la www/

      - name: 3. Install Capacitor, Custom App Icon, and Native Folder Picker
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          npm install --no-audit --no-fund --fetch-timeout=60000
          npx cap telemetry off || true
          npx cap add android
          npx cap sync android
          
          # Inject MainActivity with AndroidFolderSaver
          mkdir -p android/app/src/main/java/com/wyyty/app
          cp MainActivity.java android/app/src/main/java/com/wyyty/app/MainActivity.java
          
          # Inject custom App Icons into Android mipmap directories
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          if [ -d "res" ]; then
            cp -r res/* android/app/src/main/res/
          fi
          
          sed -i 's/networkTimeout=10000/networkTimeout=60000/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" /><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" /><uses-feature android:name="android.hardware.camera" android:required="false" /></manifest>|' android/app/src/main/AndroidManifest.xml

      - name: 4. Build APK with Gradle
        working-directory: ./android
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../WYyTy.apk
          ls -lh ../WYyTy.apk

      - name: 5. Publish WYyTy.apk to Repository and GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" WYyTy.apk --title "WYyTy Android APK (v1.0.${{ github.run_number }})" --notes "點擊下方 WYyTy.apk 即可下載安裝至 Android 手機（已套用專屬新圖示、Firebase 雲端同步與原生資料夾另存視窗）。" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ github.ref_name }}"
          git add -f WYyTy.apk
          git commit -m "Auto-build WYyTy Android APK [skip ci]" || true
          git push origin "${{ github.ref_name }}" || true
