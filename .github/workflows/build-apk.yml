name: Build Android APK (藍箱記錄)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 1. Checkout Repository (Pure Git)
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

      - name: 2. Decode Blue Chest Icon & Upgrade HTML
        run: |
          if [ ! -f "index.html" ]; then
            ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE"
            fi
          fi
          echo "" | base64 -d > blue_chest_icon.png
          cp -f blue_chest_icon.png icon-192.png
          cp -f blue_chest_icon.png icon-512.png
          cp -f blue_chest_icon.png icon.png
          rm -rf www android
          mkdir -p www
          echo "" | base64 -d > patch_index.py
          python3 patch_index.py
          cp -f index.html www/index.html
          for f in manifest.json sw.js icon-192.png icon-512.png icon.png; do
            [ -f "$f" ] && cp -f "$f" www/ || true
          done

      - name: 3. Initialize Capacitor Android Project
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo '{"name":"blue-chest-tracker","version":"2.0.0","private":true,"dependencies":{"@capacitor/android":"6.1.2","@capacitor/cli":"6.1.2","@capacitor/core":"6.1.2"}}' > package.json
          echo '{"appId":"com.gbf.bluechest.v2","appName":"藍箱記錄","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          npm install --no-audit --no-fund --fetch-timeout=60000
          npx cap telemetry off || true
          npx cap add android
          npx cap sync android

      - name: 4. Apply Blue Chest Icon & Native Folder Picker & Build APK
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          rm -rf android/app/src/main/res/mipmap-anydpi*
          rm -rf android/app/src/main/res/drawable*/ic_launcher*
          rm -rf android/app/src/main/res/values/ic_launcher*
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp -f blue_chest_icon.png "$dir/ic_launcher.png"
              cp -f blue_chest_icon.png "$dir/ic_launcher_round.png"
              cp -f blue_chest_icon.png "$dir/ic_launcher_foreground.png"
            fi
          done
          mkdir -p android/app/src/main/java/com/gbf/bluechest/v2
          echo "" | base64 -d > android/app/src/main/java/com/gbf/bluechest/v2/MainActivity.java
          sed -i 's/networkTimeout=10000/networkTimeout=60000/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><application|' android/app/src/main/AndroidManifest.xml || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 5. Save APK to Repository & Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp -f "$APK_PATH" ./blue-chest-tracker.apk
            cp -f "$APK_PATH" ./藍箱記錄.apk
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f blue-chest-tracker.apk 藍箱記錄.apk index.html icon-192.png icon-512.png icon.png
            git commit -m "Auto-build 藍箱記錄 Android APK [skip ci]" || true
            git push origin HEAD:${GITHUB_REF_NAME} || true
            gh release create "v2.0.${GITHUB_RUN_NUMBER}" ./藍箱記錄.apk --title "藍箱記錄 APK v2.0.${GITHUB_RUN_NUMBER}" --notes "點擊下方 藍箱記錄.apk 即可直接下載到 Android 手機安裝並離線使用。" || true
          fi
